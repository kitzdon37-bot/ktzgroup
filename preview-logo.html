<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>Prévisualisation logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 60px; padding: 40px; }

  h2 { color: #555; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }

  /* ── Fond blanc (navbar actuelle) ── */
  .preview-white {
    background: #fff;
    padding: 16px 32px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    display: flex;
    align-items: center;
    gap: 48px;
    width: 100%;
    max-width: 800px;
  }

  /* ── Fond sombre ── */
  .preview-dark {
    background: #1a1a2e;
    padding: 16px 32px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
    display: flex;
    align-items: center;
    gap: 48px;
    width: 100%;
    max-width: 800px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
    text-decoration: none;
    flex-shrink: 0;
  }

  .brand img {
    height: 100px;
    width: auto;
    object-fit: contain;
    display: block;
  }

  .brand-sub {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #f97316;
    letter-spacing: 3px;
    text-align: center;
    text-transform: uppercase;
    margin-top: 4px;
    padding-top: 5px;
    border-top: 1.5px solid #f97316;
    width: 100%;
  }

  /* Faux menu */
  .fake-nav { display: flex; gap: 24px; }
  .fake-nav a { color: #333; text-decoration: none; font-size: 15px; font-weight: 500; }
  .preview-dark .fake-nav a { color: #fff; }
  .fake-btn { background: #f97316; color: #fff; padding: 10px 22px; border-radius: 8px; font-weight: 700; font-size: 14px; text-decoration: none; }
  .spacer { flex: 1; }

  /* Grande version isolée */
  .big-preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fff;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  .big-preview img { height: 200px; width: auto; }
  .big-preview .sub {
    font-size: 18px;
    font-weight: 700;
    color: #f97316;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 2px solid #f97316;
  }
</style>

<style>
/* ── KTZ Orange Brand Theme ────────────────────────────────── */

/* Boutons CTA principaux → orange */
.button.is-dark {
  background-color: #f97316 !important;
  box-shadow: none !important;
}
.button.is-dark:hover {
  background-color: #ea6a0c !important;
}

/* Labels de section (ex : "Nos Programmes", "Notre Mission") */
.section-tag {
  color: #f97316 !important;
  font-weight: 700;
}

/* Lien nav actif / survol */
.header-menu-nav-link:hover,
.header-menu-nav-link.w--current {
  background-color: #f97316 !important;
  color: #fff !important;
}
.header-nav-link:hover,
.header-nav-link.w--current {
  color: #f97316 !important;
}

/* Titres du footer */
.footer-title {
  color: #f97316 !important;
}

/* Liens footer au survol */
.footer-nav-link:hover,
.footer-nav-link.w--current {
  color: #f97316 !important;
}

/* Catégories blog au survol */
.blog-category:hover {
  background-color: #f97316 !important;
  border-color: #f97316 !important;
  color: #fff !important;
}

/* Barre de soulignement bloc À propos */
.about-hover-dash {
  background-color: #f97316 !important;
}

/* Bouton newsletter */
.submit-button {
  background-color: #f97316 !important;
  color: #fff !important;
  background-image: none !important;
  padding-right: 30px !important;
}

/* Bouton de la page accordion actif */
.accordion-item.w--current .accordion-head {
  color: #f97316 !important;
}

/* Titres des programmes → orange */
.program-title {
  color: #f97316 !important;
}

/* Lien "Voir le programme" → orange */
.icon-text-link .link-text,
.icon-text-link:hover .link-text {
  color: #f97316 !important;
}
.icon-text-link .link-icon {
  filter: invert(57%) sepia(79%) saturate(2044%) hue-rotate(358deg) brightness(101%) contrast(95%);
}
/* ─────────────────────────────────────────────────────────── */
</style>
</head>
<body>

  <h2>Vue en grand</h2>
  <div class="big-preview">
    <span style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:110px;height:110px;margin-left:12px;flex-shrink:0;">
  <img src="logo-ktzgroup.png" alt="KTZ GROUP SAS" style="width:110px;height:110px;display:block;"/>
</span>
    <span class="sub">KTZ GROUP</span>
  </div>

  <h2>Dans la navbar — fond blanc</h2>
  <div class="preview-white">
    <a class="brand">
      <span style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:110px;height:110px;margin-left:12px;flex-shrink:0;">
  <img src="logo-ktzgroup.png" alt="KTZ GROUP SAS" style="width:110px;height:110px;display:block;"/>
</span>
      <span class="brand-sub">KTZ GROUP</span>
    </a>
    <div class="fake-nav">
      <a href="#">Accueil</a>
      <a href="#">Qui sommes-nous</a>
      <a href="#">Nos Programmes</a>
      <a href="#">Blog</a>
    </div>
    <div class="spacer"></div>
    <a class="fake-btn">Faire un don</a>
  </div>

  <h2>Dans la navbar — fond sombre</h2>
  <div class="preview-dark">
    <a class="brand">
      <span style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:110px;height:110px;margin-left:12px;flex-shrink:0;">
  <img src="logo-ktzgroup.png" alt="KTZ GROUP SAS" style="width:110px;height:110px;display:block;"/>
</span>
      <span class="brand-sub">KTZ GROUP</span>
    </a>
    <div class="fake-nav">
      <a href="#">Accueil</a>
      <a href="#">Qui sommes-nous</a>
      <a href="#">Nos Programmes</a>
      <a href="#">Blog</a>
    </div>
    <div class="spacer"></div>
    <a class="fake-btn">Faire un don</a>
  </div>

</body>
</html>
